<!-- @dsCard group="Brand" name="Mark" -->
<title>Kept DS — Mark</title>
<style>
:root{--cream:#F7F3EA;--card:#FFFFFF;--forest:#1F332B;--body:#4C5A50;--leaf:#2E7D5B;--leaf-d:#256A4C;--wax:#C33F35;--hair:#E2DCCB;--soft:#EDE7D8;
--serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;--sans:'Avenir Next',Avenir,'Segoe UI','Helvetica Neue',sans-serif;--mono:'Courier New',Courier,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--forest);font-family:var(--sans);line-height:1.6;padding:28px}
.dot{color:var(--wax)}
</style>
<h3 style="font-family:var(--serif);margin:0 0 20px">The mark — the dot is the logo</h3>
<div style="display:flex;gap:28px;align-items:center;flex-wrap:wrap">
<div style="font-size:64px;font-weight:700;letter-spacing:-.035em;line-height:1">kept<span class="dot">.</span></div>
<div style="width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#D65A50,#8E2921 75%);box-shadow:inset 0 1px 4px rgba(255,255,255,.4),0 3px 8px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;color:#F7E9E4;font-weight:700;font-size:24px">k.</div>
<div style="background:var(--forest);color:#EFEAE0;border-radius:10px;padding:18px 26px;font-size:40px;font-weight:700;letter-spacing:-.035em">kept<span class="dot">.</span></div>
</div>
<ul style="font-size:12.5px;color:var(--body);max-width:58ch;margin-top:16px;padding-left:18px">
<li>Always lowercase. Dot always wax red. In motion, the dot <b>lands</b> (drops + settles, once per page load).</li>
<li>In print/documents the dot becomes the wax seal. Monogram: <b>k.</b></li>
<li>Never: uppercase, outlines, gradients on the mark itself.</li></ul>
