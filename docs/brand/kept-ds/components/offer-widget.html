<!-- @dsCard group="Components" name="Offer Widget" -->
<title>Kept DS — Offer Widget</title>
<style>
:root{--cream:#F7F3EA;--card:#FFFFFF;--forest:#1F332B;--body:#4C5A50;--leaf:#2E7D5B;--leaf-d:#256A4C;--wax:#C33F35;--hair:#E2DCCB;--soft:#EDE7D8;
--serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;--sans:'Avenir Next',Avenir,'Segoe UI','Helvetica Neue',sans-serif;--mono:'Courier New',Courier,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--forest);font-family:var(--sans);line-height:1.6;padding:28px}
.dot{color:var(--wax)}
</style>
<div style="background:var(--card);border-radius:16px;padding:26px 28px 22px;box-shadow:0 24px 50px -24px rgba(31,51,43,.35);border:1px solid #EFE9DB;max-width:380px">
<h4 style="font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8B9489;margin:0 0 6px;font-weight:600">Your written offer</h4>
<p style="font-family:var(--serif);font-size:17px;margin:0 0 16px">14 Marsh Lane, Sale, M33</p>
<div style="display:flex;justify-content:space-between;font-size:14px;padding:10px 0;border-bottom:1px solid #F0EDE4"><span style="color:var(--body)">What it would fetch in 6 months</span><b>£212,000</b></div>
<div style="display:flex;justify-content:space-between;font-size:14px;padding:10px 0;border-bottom:1px solid #F0EDE4"><span style="color:var(--body)">Speed &amp; certainty — our margin</span><b>−£28,000</b></div>
<div style="display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 0"><span style="font-weight:600">Yours in ~3 weeks</span><b style="font-family:var(--serif);font-size:26px;color:var(--leaf)">£184,000</b></div>
<div style="display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--hair);font-size:12.5px;color:var(--body)"><span style="width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#D65A50,#8E2921 75%);flex:none"></span><span>In writing. This figure will not change.</span></div></div>
<p style="font-size:12px;color:var(--body);margin-top:16px;max-width:44ch">Radical transparency: we show the discount instead of hiding it. Confirmed figures only after viewing.</p>
